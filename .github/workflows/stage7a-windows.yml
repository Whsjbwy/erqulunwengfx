name: Stage 7A Windows read-only evidence audit
on:
  pull_request:
    branches: [research/auv-obstacle-baselines-stage6ds]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-public-evidence:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install frozen existing Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check exact HEAD without planning or control replay
        run: python scripts/stage7a_quality.py --output results/stage7a/ci-quality
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage7a-windows-read-only-evidence
          path: results/stage7a/ci-quality/
          if-no-files-found: error
