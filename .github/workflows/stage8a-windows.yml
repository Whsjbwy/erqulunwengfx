name: Stage 8A Windows review gate and frozen regression
on:
  pull_request:
    branches: [research/auv-stage7b0-mature-tracking-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-and-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install frozen project dependencies
        run: python -m pip install -e '.[dev]'
      - name: Full regression and gate records at exact HEAD without flow experiments
        run: python scripts/stage8a_quality.py --output results/stage8a/ci-quality
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage8a-windows-review-evidence
          path: results/stage8a/ci-quality/
          if-no-files-found: error
