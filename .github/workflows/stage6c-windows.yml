name: Stage 6C Windows official OMPL calibration acceptance
on:
  pull_request:
    branches: [research/auv-control-baselines-stage6b]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-python:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install existing Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Python compilation and full tests
        run: |
          python -m compileall -q src tests scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q --junitxml=results/stage6c/ci-validation/pytest.xml
      - name: Ruff and formatting
        run: |
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check .
      - name: Build pinned official OMPL and frozen adapter
        run: python scripts/stage6b_build.py --local-root "$env:RUNNER_TEMP/auv-dependencies" --jobs 2
      - name: Build Stage6C observer and run two CTests
        run: python scripts/stage6c_build.py --dependency-root "$env:RUNNER_TEMP/auv-dependencies" --local-root "$env:RUNNER_TEMP/auv-stage6c" --jobs 2
      - name: Check C++ formatting
        run: |
          & "$env:RUNNER_TEMP/auv-dependencies/packages/llvm-mingw-20261104-ucrt-x86_64/bin/clang-format.exe" --dry-run --Werror '-style={BasedOnStyle: LLVM, IndentWidth: 4, ColumnLimit: 100}' native/stage6c/adapter.hpp native/stage6c/adapter_tests.cpp native/stage6c/ompl_runner.cpp
      - name: Generate thirteen frozen deterministic fixtures
        run: |
          python -m gsunlight_repro.stage6b.runner accept --executable "$env:RUNNER_TEMP/auv-dependencies/build/adapter/auv6b_runner.exe" --build-root "$env:RUNNER_TEMP/auv-dependencies" --local-root "$env:RUNNER_TEMP/auv-frozen-fixtures" --output results/stage6b/ci-stage6c-fixtures
      - name: Validate thirteen actual Stage6C interface cases
        run: |
          python -m gsunlight_repro.stage6c.acceptance --source-root "$env:RUNNER_TEMP/auv-frozen-fixtures" --executable "$env:RUNNER_TEMP/auv-stage6c/build/auv6c_runner.exe" --dependency-root "$env:RUNNER_TEMP/auv-dependencies" --local-root "$env:RUNNER_TEMP/auv-stage6c-records" --output results/stage6c/ci-validation
      - name: Record the actually checked final HEAD
        env:
          STAGE6C_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/stage6c_ci_evidence.py --dependency-root "$env:RUNNER_TEMP/auv-dependencies" --build-root "$env:RUNNER_TEMP/auv-stage6c" --frozen-output results/stage6b/ci-stage6c-fixtures
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage6c-windows-evidence
          path: results/stage6c/ci-validation/
          if-no-files-found: warn
      - name: Show build diagnostics on failure
        if: failure()
        run: |
          foreach ($taskRoot in @("$env:RUNNER_TEMP/auv-dependencies", "$env:RUNNER_TEMP/auv-stage6c")) {
            $taskLogs = Get-ChildItem -LiteralPath $taskRoot -Filter 'build-*.log' -ErrorAction SilentlyContinue | Sort-Object Name | Select-Object -Last 2
            foreach ($taskLog in $taskLogs) { Get-Content -LiteralPath $taskLog.FullName -Tail 45 }
          }
