name: Stage 6D Windows blocked-gate reproduction
on:
  pull_request:
    branches: [research/auv-control-baselines-stage6c]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-python-and-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install existing Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile and run full Python suite
        run: |
          python -m compileall -q src tests scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q --junitxml=results/stage6d/ci-validation/pytest.xml
      - name: Ruff and formatting
        run: |
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check .
      - name: Build pinned official OMPL and frozen6B adapter
        run: python scripts/stage6b_build.py --local-root "$env:RUNNER_TEMP/auv-dependencies" --jobs 2
      - name: Rebuild frozen6C adapter and run two CTests
        run: python scripts/stage6c_build.py --dependency-root "$env:RUNNER_TEMP/auv-dependencies" --local-root "$env:RUNNER_TEMP/auv-stage6d-native" --jobs 2
      - name: Build separate diagnostic and detect the documented contract gap
        run: python scripts/stage6d_probe_build.py --dependency-root "$env:RUNNER_TEMP/auv-dependencies" --local-root "$env:RUNNER_TEMP/auv-stage6d-probe"
      - name: Check C++ formatting
        run: |
          & "$env:RUNNER_TEMP/auv-dependencies/packages/llvm-mingw-20261104-ucrt-x86_64/bin/clang-format.exe" --dry-run --Werror '-style={BasedOnStyle: LLVM, IndentWidth: 4, ColumnLimit: 100}' native/stage6c/adapter.hpp native/stage6c/adapter_tests.cpp native/stage6c/ompl_runner.cpp native/stage6d/interface_probe.cpp
      - name: Generate thirteen frozen deterministic fixtures
        run: |
          python -m gsunlight_repro.stage6b.runner accept --executable "$env:RUNNER_TEMP/auv-dependencies/build/adapter/auv6b_runner.exe" --build-root "$env:RUNNER_TEMP/auv-dependencies" --local-root "$env:RUNNER_TEMP/auv-frozen-fixtures" --output results/stage6b/ci-stage6d-fixtures
      - name: Confirm thirteen historical SI fixtures still pass
        run: |
          python -m gsunlight_repro.stage6c.acceptance --source-root "$env:RUNNER_TEMP/auv-frozen-fixtures" --executable "$env:RUNNER_TEMP/auv-stage6d-native/build/auv6c_runner.exe" --dependency-root "$env:RUNNER_TEMP/auv-dependencies" --local-root "$env:RUNNER_TEMP/auv-stage6d-interface" --output results/stage6d/ci-validation
      - name: Reproduce failed terrain pitch mapping without a planning search
        run: |
          python -m gsunlight_repro.stage6d.diagnostics --probe "$env:RUNNER_TEMP/auv-stage6d-probe/build/auv6d_probe.exe" --dependency-root "$env:RUNNER_TEMP/auv-dependencies" --local-root "$env:RUNNER_TEMP/auv-stage6d-diagnostic" --output results/stage6d/ci-validation
      - name: Bind actual final HEAD and BLOCKED scientific gate
        env:
          STAGE6D_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/stage6d_ci_evidence.py --dependency-root "$env:RUNNER_TEMP/auv-dependencies" --build-root "$env:RUNNER_TEMP/auv-stage6d-native" --probe-root "$env:RUNNER_TEMP/auv-stage6d-probe" --frozen-output results/stage6b/ci-stage6d-fixtures
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage6d-windows-blocked-evidence
          path: results/stage6d/ci-validation/
          if-no-files-found: warn
      - name: Show native diagnostics on failure
        if: failure()
        run: |
          foreach ($taskRoot in @("$env:RUNNER_TEMP/auv-dependencies", "$env:RUNNER_TEMP/auv-stage6d-native", "$env:RUNNER_TEMP/auv-stage6d-probe")) {
            $taskLogs = Get-ChildItem -LiteralPath $taskRoot -Filter 'build-*.log' -ErrorAction SilentlyContinue | Sort-Object Name | Select-Object -Last 2
            foreach ($taskLog in $taskLogs) { Get-Content -LiteralPath $taskLog.FullName -Tail 45 }
          }
